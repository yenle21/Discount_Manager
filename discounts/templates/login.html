<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{%block title%}Trường Mần Non ABC{%endblock%}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}?v=1.2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ĐĂNG NHẬP</title>
</head>
{% block content %}
<div class="main-container">
    <div class="login-card">
        <div class="card-header text-center border-0 mb-2">
            <h2>Đăng nhập</h2>
        </div>

        {% if err_msg%}
        <div class="alert alert-danger text-center">{{err_msg}}</div>
        {% endif %}
        <form method="post">
            <div class="mb-3">
                <select class="form-select custom-input-style" aria-label="Chọn vai trò" name="role_select">
                    <option value="KHACHHANG">Khách Hàng</option>
                    <option value="ADMIN">Quản Trị Viên</option>
                </select>
            </div>
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text custom-input-group-text">&#128100;</span>
                    <input type="text" class="form-control custom-input-style" placeholder="Tên đăng nhập...."
                           name="username" required>
                </div>
            </div>

            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text custom-input-group-text">&#128274;</span>
                    <input type="password" class="form-control custom-input-style" placeholder="Mật khẩu..."
                           name="password" required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-custom">Đăng nhập</button>
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <a href="javascript:void(0);"
                   onclick="startForgotPassword()"
                   style="color: #8e24aa; text-decoration: none; font-weight: 500;">
                    Quên mật khẩu?
                </a>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


            <script src="{{ url_for('static', filename='js/login_reset.js') }}"></script>
        </form>
    </div>
</div>
{% endblock %}
