{%extends 'layout/base.html'%}

{%block title%}Đăng nhập{%endblock%}

{%block content%}

<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <h3 style="color:#A56EFF;" class="text-center mb-4">Đăng nhập</h3>
        <form method="post">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Nhập tài khoản" name="username">
                <label for="username">Nhập tài khoản</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" name="password">
                <label for="password">Nhập mật khẩu</label>
            </div>

            <div class="d-flex justify-content-center mt-3">
                <button class="btn px-5" type="submit" style="background:#A56EFF; color:white;">Đăng nhập</button>
            </div>
        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} mt-2">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>
</div>

{%endblock%}
