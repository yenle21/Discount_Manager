{% extends 'layout/base.html' %}

{% block content %}
<div class="app-container">

    <aside class="sidebar">
        <a href="/" class="nav-item">
            <span>🏠 Trang chủ</span>
        </a>
        <a href="/cart" class="nav-item">
            <span>🛒 Giỏ hàng</span>
        </a>

    </aside>

    <main class="main-content">
        <div class="d-flex justify-content-center px-5 mb-4">
            <div class="input-group w-75 shadow-sm" style="border-radius: 10px; overflow: hidden;">

                <button class="btn btn-light dropdown-toggle border-end" type="button" data-bs-toggle="dropdown"
                        style="background-color: #f8f9fa; color: #333; font-weight: 500; min-width: 120px;">
                    Danh mục
                </button>
                <ul class="dropdown-menu">
                    {% for c in categories %}
                    <li><a class="dropdown-item" href="/?category_id={{ c.id }}">{{ c.name }}</a></li>
                    {% endfor %}
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" href="#">Tất cả sản phẩm</a></li>
                </ul>

                <input type="text" class="form-control border-0" placeholder="Tìm kiếm sản phẩm..."
                       style="padding: 12px 20px;">

                <button class="btn btn-secondary px-4 border-0" type="button"
                        style="background-color: #ccc; color: #333; font-weight: 500;">
                    Lọc
                </button>

            </div>
        </div>

        <div class="product-grid">
            {% for p in products %}
            <div class="product-card shadow-sm">
                <img src="{{ p.image }}" alt="{{ p.name }}">
                <h6 class="fw-bold">{{ p.name }}</h6>
                <p class="text-danger fw-bold">{{ "{:,.0f}".format(p.price|float) }}đ</p>
                <button class="btn btn-success w-100 rounded-pill">Thêm vào giỏ</button>
            </div>
            {% endfor %}
        </div>
    </main>
</div>
{% endblock %}
