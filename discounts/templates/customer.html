<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-2 sidebar">
            <h4 class="logo">🏪</h4>
            <ul>
                <li>🏠 Trang chủ</li>
                <li>🛒 Giỏ hàng <span class="badge bg-danger">2</span></li>
            </ul>
        </div>

        <!-- Main -->
        <div class="col-10 main">

            <!-- Header -->
            <div class="header d-flex justify-content-between align-items-center">
                <input type="text" class="form-control search" placeholder="Tìm kiếm sản phẩm...">
                <button class="btn btn-secondary">Lọc</button>
                <div class="user">Bao Yen👤</div>
            </div>

            <!-- Products -->
            <div class="row mt-4">
                {% for p in products %}
                <div class="col-md-3">
                    <div class="card product-card">
                        <img src="{{ p.image }}" class="card-img-top">
                        <div class="card-body">
                            <h6>{{ p.name }}</h6>
                            <p class="price">{{ p.price }}</p>
                            <button class="btn btn-success w-100">Thêm vào giỏ</button>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>

        </div>
    </div>
</div>

</body>
</html>
