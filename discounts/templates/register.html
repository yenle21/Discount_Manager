{%extends 'layout/base.html'%}

{%block title%}Đăng ký{%endblock%}

{%block content%}

<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <h3 style="color:#A56EFF;" class="text-center mb-4">ĐĂNG KÝ</h3>

        {% if err_msg %}
        <div class="alert alert-danger">{{err_msg}}</div>
        {% endif %}

        <form method="post" action="/register" enctype="multipart/form-data">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="name" placeholder="Nhập họ tên" name="name">
                <label for="name">Nhập họ tên</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Nhập tên tài khoản" name="username" required>
                <label for="username">Nhập tên tài khoản</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" name="password" pattern=".{8,}" required>
                <label for="password">Nhập mật khẩu</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="confirm" placeholder="Nhập lại mật khẩu" name="confirm" required>
                <label for="confirm">Nhập lại mật khẩu</label>
            </div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="Nhập email" name="email" required>
                <label for="email">Nhập email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="file" class="form-control" id="avatar" placeholder="Ảnh đại diện" name="avatar">
                <label for="avatar">Ảnh đại diện</label>
            </div>

            <div class="d-flex justify-content-center mt-3">
                <button class="btn px-5" type="submit" style="background:#A56EFF; color:white;">ĐĂNG KÝ</button>
            </div>
        </form>
    </div>
</div>

{%endblock%}
