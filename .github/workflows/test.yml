name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          sed -i '/pywin32/d' requirements.txt
          pip install -r requirements.txt
          pip install pytest-flask

      - name: Run tests with pytest
        env:
          # Đảm bảo có Secret Key để test session giỏ hàng không bị lỗi 500
          FLASK_SECRET_KEY: "test_secret_key"
        run: |
          # Thiết lập PYTHONPATH: Thêm thư mục hiện tại và thư mục discounts vào path
          export PYTHONPATH=$PYTHONPATH:$(pwd):$(pwd)/discounts
          
          # Chạy pytest cho toàn bộ project
          # -v: Hiện chi tiết, -s: Hiện print để debug


          pytest discounts/test/test_login/test_login.py -v -s
